name: CI

# main 반영 전후의 빌드와 테스트 검증
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 저장소 코드 조회에 필요한 최소 권한
permissions:
  contents: read

# 같은 PR 또는 브랜치의 이전 CI 실행 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 확인
        uses: actions/checkout@v6

      - name: Java 17과 Gradle 캐시 설정
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Gradle Wrapper 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 및 테스트
        run: ./gradlew build --no-daemon
